<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOORA MAX – كورة ماكس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090a;--bg2:#0e1311;--card:#121a16;--line:#1f2d26;--tx:#eef5f0;--mut:#8a9c92;--g:#16c75a;--g2:#0a8f3e;--red:#ff3b3b;--r:16px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 400px at 80% -5%,#0f3d22 0,transparent 60%),var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:auto;padding:0 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(7,9,10,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding:10px 0}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:.5px;direction:ltr;cursor:pointer}
.logo i{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 0deg,var(--g),var(--g2),var(--g));display:grid;place-items:center;font-style:normal;color:#04140a;box-shadow:0 0 18px #16c75a66}
.logo b{color:var(--g)}
.search{flex:1;max-width:340px;margin-inline-start:auto;position:relative}
.search input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:8px 38px 8px 14px;outline:none;transition:.2s}
.search input:focus{border-color:var(--g);box-shadow:0 0 0 3px #16c75a22}
.search span{position:absolute;right:13px;top:7px;color:var(--mut)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav a{padding:7px 16px;border-radius:99px;white-space:nowrap;color:var(--mut);font-weight:600;transition:.2s}
nav a:hover{color:var(--tx)}nav a.on{background:var(--g);color:#04140a}
.demo{background:#1a1a07;border-bottom:1px solid #3a3a10;color:#e6d96a;text-align:center;font-size:13px;padding:5px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.pill{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:6px 16px;cursor:pointer;transition:.2s;font-weight:600;font-size:14px}
.pill:hover{border-color:var(--g)}.pill.on{background:var(--g);color:#04140a;border-color:var(--g)}
h2{font-size:19px;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
h2:before{content:"";width:4px;height:20px;background:var(--g);border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:.25s;animation:up .5s both;display:block}
.card:hover{transform:translateY(-3px);border-color:var(--g);box-shadow:0 10px 30px #16c75a1f}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:12px;gap:8px}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px}
.badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;border:2px solid #ffffff22}
.mid{min-width:80px}.score{font-size:26px;font-weight:900;direction:ltr}.time{font-size:20px;font-weight:800;color:var(--g);direction:ltr}
.live{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:p 1.1s infinite}
@keyframes p{50%{opacity:.2;transform:scale(.6)}}
.st{font-size:11px;color:var(--mut);margin-top:4px}
.tag{font-size:10px;color:#e6d96a;border:1px solid #3a3a10;border-radius:6px;padding:0 5px}
.hero{margin:18px 0 0;padding:26px 22px;border-radius:20px;background:linear-gradient(120deg,#0d3a21,#07090a 70%);border:1px solid var(--line);animation:up .6s both}
.hero h1{font-size:clamp(24px,5vw,40px);font-weight:900}.hero h1 b{color:var(--g)}.hero p{color:var(--mut);margin-top:6px}
.player{aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:grid;place-items:center;text-align:center;color:var(--mut)}
.player video,.player iframe{width:100%;height:100%;border:0;background:#000}
.btn{background:var(--g);color:#04140a;border:0;border-radius:10px;padding:8px 16px;font-weight:800;cursor:pointer;transition:.2s}
.btn:hover{filter:brightness(1.1)}.btn.ghost{background:var(--bg2);color:var(--tx);border:1px solid var(--line)}.btn.del{background:#3a1212;color:#ff8a8a}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.srcs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.info div{background:var(--bg2);border-radius:12px;padding:10px 12px}.info small{color:var(--mut);display:block;font-size:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.form label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.form input,.form select{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;outline:none}
.form input:focus,.form select:focus{border-color:var(--g)}
.arow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.arow:hover{color:var(--g)}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.lg .card{text-align:center;font-weight:800;padding:26px 14px}
footer{margin-top:50px;border-top:1px solid var(--line);padding:24px 0;color:var(--mut);font-size:13px;text-align:center}
.empty{color:var(--mut);padding:30px;text-align:center}
@media(max-width:600px){.grid{grid-template-columns:1fr}.logo{font-size:19px}.search{max-width:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>window.KOORA_CONFIG={apiUrl:"/api/matches"};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
const {useState,useEffect,useMemo,useRef}=React;
const html=htm.bind(React.createElement);
const TZ='Africa/Casablanca',KEY='koora-max-v3',CFG=window.KOORA_CONFIG||{};

const mapSt=s=>{
 const v=String(s||'').trim().toUpperCase();
 if(['LIVE','1H','2H','HT','ET','BT','P','INT','SUSP','IN_PLAY','PAUSED'].includes(v))return 'live';
 if(['FT','AET','PEN','FINISHED'].includes(v))return 'finished';
 return 'upcoming';
};

function useApi(){
 const[s,setS]=useState({state:CFG.apiUrl?'loading':'off',ms:[]});
 useEffect(()=>{
  if(!CFG.apiUrl)return;
  let dead=false;
  const run=()=>fetch(CFG.apiUrl+'?from='+dayK(new Date())+'&days=3)
   .then(r=>{if(!r.ok)throw 0;return r.json()})
   .then(j=>{
    if(dead)return;
    const arr=Array.isArray(j)?j:(j.matches||[]);
    const iso=v=>typeof v==='number'?new Date(v<1e12?v*1000:v).toISOString():v;
    const ms=arr.map(x=>({
     id:String(x.id),lg:lgk(x.lg),h:x.h,a:x.a,t:iso(x.t),
     st:mapSt(x.st),min:x.min,hs:x.hs??0,as:x.as??0,
     venue:x.venue||'',hl:x.hl,al:x.al,sources:[]
    }));
    setS({state:'ok',ms});
   })
   .catch(()=>!dead&&setS({state:'error',ms:[]}));
  run();
  const i=setInterval(run,6e4);
  return()=>{dead=true;clearInterval(i)};
 },[]);
 return s;
}

const fmtT=i=>new Date(i).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:TZ});
const dayK=i=>new Date(i).toLocaleDateString('en-CA',{timeZone:TZ});
const fmtD=i=>new Date(i).toLocaleDateString('ar-MA-u-nu-latn',{weekday:'long',day:'numeric',month:'long',timeZone:TZ});

const LEAGUES=[
{k:'PL',ar:'الدوري الإنجليزي',en:'Premier League',al:['english premier league','epl','الدوري الإنجليزي الممتاز','البريميرليغ']},
{k:'PD',ar:'الدوري الإسباني',en:'La Liga',al:['laliga','primera division','الليغا']},
{k:'SA',ar:'الدوري الإيطالي',en:'Serie A',al:['سيري آ']},
{k:'BL1',ar:'الدوري الألماني',en:'Bundesliga',al:['البوندسليغا']},
{k:'FL1',ar:'الدوري الفرنسي',en:'Ligue 1',al:['ligue1','french ligue 1']},
{k:'CL',ar:'دوري أبطال أوروبا',en:'UEFA Champions League',al:['champions league']},
{k:'BOT',ar:'الدوري المغربي',en:'Botola Pro',al:['botola','botola pro inwi','botola pro 1','البطولة المغربية','البطولة الاحترافية','البطولة الوطنية']},
{k:'SPL',ar:'الدوري السعودي',en:'Saudi Pro League',al:['saudi league','روشن','دوري روشن السعودي']},
{k:'ALG',ar:'الدوري الجزائري',en:'Algeria Ligue 1',al:['algerian ligue 1','algeria ligue professionnelle 1','الرابطة المحترفة الأولى']},
{k:'TUN',ar:'الدوري التونسي',en:'Tunisia Ligue 1',al:['tunisian ligue 1','ligue professionnelle 1','الرابطة المحترفة التونسية']},
{k:'EGY',ar:'الدوري المصري',en:'Egyptian Premier League',al:['egypt premier league','الدوري المصري الممتاز']},
{k:'CAF',ar:'دوري أبطال إفريقيا',en:'CAF Champions League',al:['champions league caf','african champions league','دوري أبطال أفريقيا']}
];

const LGID={39:'PL',140:'PD',135:'SA',78:'BL1',61:'FL1',2:'CL',200:'BOT',307:'SPL',186:'ALG',202:'TUN',233:'EGY',12:'CAF'};
const nz=v=>String(v==null?'':v).toLowerCase().normalize('NFKD')
 .replace(/[\u0300-\u036f\u064B-\u065F\u0670\u0640]/g,'')
 .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
 .replace(/[^\p{L}\p{N}]+/gu,' ').trim();

function lgk(v){
 const t=nz(v);
 if(!t)return v;
 if(/^\d+$/.test(t)&&LGID[+t])return LGID[+t];
 let best=null,bl=0;
 for(const l of LEAGUES)for(const a of [l.k,l.en,l.ar,...l.al]){
  const z=nz(a);
  if(z===t)return l.k;
  if(z.length>=5&&t.includes(z)&&z.length>bl){best=l.k;bl=z.length}
 }
 return best||v;
}

const LN=k=>LEAGUES.find(l=>l.k===k)||{ar:k,en:k};
const STAT={live:'مباشر',upcoming:'لم تبدأ',finished:'انتهت'};
const CHANNELS=[
 {id:'arryadia',name:'الرياضية المغربية',url:'https://snrtlive.ma/ar/arryadia'}
];

const col=n=>`hsl(${[...n].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360} 55% 32%)`;
const mk=(id,lg,h,a,off,st,venue)=>({id,lg,h,a,t:new Date(Date.now()+off*6e4).toISOString(),st,hs:0,as:0,venue,sources:[],demo:true});
const seed=()=>[];
const load=()=>{try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()};

const useHash=()=>{
 const g=()=>location.hash.slice(1)||'home';
 const[h,s]=useState(g);
 useEffect(()=>{
  const f=()=>{s(g());window.scrollTo(0,0)};
  addEventListener('hashchange',f);
  return()=>removeEventListener('hashchange',f);
 },[]);
 return h;
};

const Badge=({n,img})=>html`
 <div class="badge" style=${{background:img?'#fff':col(n),overflow:'hidden'}}>
 ${img?html`<img src=${img} alt=${n} loading="lazy" style=${{width:'80%',height:'80%',objectFit:'contain'}} onError=${e=>{e.target.style.display='none'}}/>`:n[0]}
 </div>`;

const Card=({m,i})=>html`
 <a class="card" href=${'#match-'+m.id} style=${{animationDelay:i*50+'ms'}}>
 <div class="meta"><span>${LN(m.lg).ar}</span><span>${m.st==='live'?html`<span class="live">مباشر</span>`:STAT[m.st]} ${m.demo&&html`<span class="tag">تجريبي</span>`}</span></div>
 <div class="row">
  <div class="team"><${Badge} n=${m.h} img=${m.hl}/>${m.h}</div>
  <div class="mid">${m.st==='upcoming'?html`<div class="time">${fmtT(m.t)}</div><div class="st">توقيت المغرب</div>`:html`<div class="score">${m.hs} - ${m.as}</div><div class="st">${m.st==='live'?(m.min?m.min+"'":'جارية الآن'):'نهائي'}</div>`}</div>
  <div class="team"><${Badge} n=${m.a} img=${m.al}/>${m.a}</div>
 </div></a>`;

const Section=({title,list})=>list.length?html`
 <h2>${title}</h2>
 <div class="grid">${list.map((m,i)=>html`<${Card} key=${m.id} m=${m} i=${i}/>` )}</div>`:null;

function Player({src}){
 const v=useRef();
 useEffect(()=>{
  if(!src||src.type!=='hls'||!v.current)return;
  let h;
  if(window.Hls&&Hls.isSupported()){
   h=new Hls();h.loadSource(src.url);h.attachMedia(v.current);
  }else v.current.src=src.url;
  return()=>h&&h.destroy();
 },[src]);
 if(!src)return html`
  <div class="player"><div><div style=${{fontSize:42}}>📺</div>
  <p>لا يوجد مصدر بث مرخّص لهذه المباراة حالياً</p>
  <small>يمكن للمشرف إضافة رابط من لوحة التحكم</small></div></div>`;
 return html`
  <div class="player">
  ${src.type==='embed'?html`<iframe src=${src.url} allowfullscreen referrerpolicy="no-referrer"/>`:
    src.type==='mp4'?html`<video key=${src.url} src=${src.url} controls playsinline/>`:
    html`<video ref=${v} controls playsinline/>`}
  </div>`;
}

function MatchPage({m}){
 const[si,setSi]=useState(0);
 if(!m)return html`<div class="empty">المباراة غير موجودة. <a href="#home" style=${{color:'var(--g)'}}>العودة للرئيسية</a></div>`;
 const src=m.sources?.[si]||m.sources?.[0];
 const channel=CHANNELS.find(c=>c.id===m.channel);

 return html`
 <div style=${{paddingTop:18,animation:'up .5s both'}}>
  <div class="panel" style=${{marginTop:0}}>
   <div class="meta">
    <span>${LN(m.lg).ar}</span>
    <span>${m.st==='live'?html`<span class="live">مباشر</span>`:STAT[m.st]}</span>
   </div>
   <div class="row">
    <div class="team"><${Badge} n=${m.h} img=${m.hl}/>${m.h}</div>
    <div class="mid">${m.st==='upcoming'?html`<div class="time">${fmtT(m.t)}</div>`:html`<div class="score">${m.hs} - ${m.as}</div>`}</div>
    <div class="team"><${Badge} n=${m.a} img=${m.al}/>${m.a}</div>
   </div>
  </div>

  <div style=${{marginTop:14}}><${Player} src=${src}/></div>

  ${channel&&html`
   <div class="panel" style=${{textAlign:'center'}}>
    <h2>القناة الناقلة</h2>
    <p>${channel.name}</p>
    <a href=${channel.url} target="_blank" rel="noopener noreferrer" class="btn">شاهد القناة الرسمية</a>
   </div>
  `}

  <div class="panel">
   <h2 style=${{marginTop:0}}>معلومات المباراة</h2>
   <div class="info">
    <div><small>البطولة</small>${LN(m.lg).ar} · ${LN(m.lg).en}</div>
    <div><small>التاريخ</small>${fmtD(m.t)}</div>
    <div><small>التوقيت (المغرب)</small>${fmtT(m.t)}</div>
    <div><small>الملعب</small>${m.venue||'—'}</div>
    <div><small>الحالة</small>${STAT[m.st]}</div>
   </div>
  </div>
 </div>`;
}
 function Home({ms,filter,setFilter,query}){
 const today=dayK(new Date());
 const tomorrow=dayK(new Date(Date.now()+86400000));
 const filtered=ms.filter(m=>{
  const q=nz(query);
  const matchQ=!q||nz(m.h+' '+m.a+' '+LN(m.lg).ar+' '+LN(m.lg).en).includes(q);
  const matchL=filter==='all'||m.lg===filter;
  return matchQ&&matchL;
 });
 const live=filtered.filter(m=>m.st==='live');
 const upcoming=filtered.filter(m=>m.st==='upcoming').sort((a,b)=>new Date(a.t)-new Date(b.t));
 const finished=filtered.filter(m=>m.st==='finished').sort((a,b)=>new Date(b.t)-new Date(a.t));
 const todayMs=filtered.filter(m=>dayK(m.t)===today);
 const tomorrowMs=filtered.filter(m=>dayK(m.t)===tomorrow);

 return html`
 <section class="hero">
  <h1>KOORA <b>MAX</b></h1>
  <p>كل مباريات كرة القدم في مكان واحد</p>
  <p style=${{fontSize:12,marginTop:10}}>تابع النتائج والمواعيد والقنوات الرسمية الناقلة</p>
 </section>

 <div class="pills">
  <button class=${'pill '+(filter==='all'?'on':'')} onClick=${()=>setFilter('all')}>الكل</button>
  ${LEAGUES.map(l=>html`
   <button key=${l.k} class=${'pill '+(filter===l.k?'on':'')} onClick=${()=>setFilter(l.k)}>${l.ar}</button>
  `)}
 </div>

 ${live.length?html`<${Section} title="مباريات مباشرة" list=${live}/>`:null}
 ${todayMs.length?html`<${Section} title="مباريات اليوم" list=${todayMs.filter(m=>m.st!=='live')}/>`:null}
 ${tomorrowMs.length?html`<${Section} title="مباريات الغد" list=${tomorrowMs}/>`:null}
 ${upcoming.length?html`<${Section} title="المباريات القادمة" list=${upcoming.filter(m=>dayK(m.t)!==today&&dayK(m.t)!==tomorrow)}/>`:null}
 ${finished.length?html`<${Section} title="مباريات انتهت" list=${finished}/>`:null}
 ${!filtered.length?html`<div class="empty">لا توجد مباريات مطابقة حالياً</div>`:null}
 `;
}

function Leagues(){
 return html`
 <h2>البطولات</h2>
 <div class="lg">
 ${LEAGUES.map(l=>html`
  <a class="card" href=${'#league-'+l.k}>
   <div style=${{fontSize:30,marginBottom:8}}>🏆</div>
   <div>${l.ar}</div>
   <small style=${{color:'var(--mut)'}}>${l.en}</small>
  </a>
 `)}
 </div>`;
}

function LeaguePage({lg,ms}){
 const league=LEAGUES.find(l=>l.k===lg);
 const list=ms.filter(m=>m.lg===lg).sort((a,b)=>new Date(a.t)-new Date(b.t));
 return html`
 <h2>${league?.ar||'البطولة'}</h2>
 <p style=${{color:'var(--mut)',marginBottom:12}}>${league?.en||''}</p>
 ${list.length?html`<div class="grid">${list.map((m,i)=>html`<${Card} key=${m.id} m=${m} i=${i}/>` )}</div>`:html`<div class="empty">لا توجد مباريات لهذه البطولة حالياً</div>`}
 `;
}

function Admin({ms,setMs,isApi,onClose}){
 const[pass,setPass]=useState('');
 const[ok,setOk]=useState(false);
 const[editing,setEditing]=useState('');
 const[showPass,setShowPass]=useState(false);

 const blank=()=>({
  id:'manual-'+Date.now(),lg:'BOT',h:'',a:'',
  t:new Date(Date.now()+3600000).toISOString(),
  st:'upcoming',hs:0,as:0,venue:'',sources:[],channel:''
 });

 const[form,setForm]=useState(blank());
 const upd=(id,patch)=>{
  setMs(list=>list.map(m=>m.id===id?{...m,...patch}:m));
 };
 const add=()=>{
  if(!form.h.trim()||!form.a.trim())return alert('دخل اسم الفريقين');
  setMs(list=>[...list,form]);
  setForm(blank());
 };
 const remove=id=>{
  if(confirm('واش متأكد من حذف المباراة؟'))setMs(list=>list.filter(m=>m.id!==id));
 };
 const edit=m=>{
  setEditing(m.id);
  setForm({...m,sources:m.sources||[]});
  window.scrollTo({top:0,behavior:'smooth'});
 };
 const saveEdit=()=>{
  setMs(list=>list.map(m=>m.id===editing?form:m));
  setEditing('');
  setForm(blank());
 };
 const addSource=()=>{
  const url=prompt('دخل رابط البث المرخّص:');
  if(!url)return;
  if(!/^https:\/\//i.test(url))return alert('خاص الرابط يبدأ بـ https://');
  const type=prompt('نوع المصدر: hls أو mp4 أو embed','hls');
  if(!['hls','mp4','embed'].includes(type))return alert('النوع غير صحيح');
  setForm(f=>({...f,sources:[...(f.sources||[]),{name:'مصدر '+((f.sources||[]).length+1),url,type}]}));
 };

 if(!ok)return html`
 <div class="panel" style=${{maxWidth:420,margin:'35px auto',textAlign:'center'}}>
  <h2>لوحة الإدارة</h2>
  <p style=${{color:'var(--mut)',marginBottom:12}}>أدخل كلمة المرور</p>
  <input type=${showPass?'text':'password'} value=${pass} onChange=${e=>setPass(e.target.value)} placeholder="كلمة المرور" style=${{width:'100%',background:'var(--bg2)',border:'1px solid var(--line)',borderRadius:10,padding:10,marginBottom:12}}/>
  <div style=${{display:'flex',gap:8,justifyContent:'center'}}>
   <button class="btn" onClick=${()=>pass==='admin'?setOk(true):alert('كلمة المرور غير صحيحة')}>دخول</button>
   <button class="btn ghost" onClick=${()=>setShowPass(!showPass)}>${showPass?'إخفاء':'إظهار'}</button>
  </div>
  <p style=${{color:'#e6d96a',fontSize:11,marginTop:15}}>كلمة المرور الافتراضية admin تجريبية فقط. غيّر نظام الدخول قبل نشر لوحة الإدارة.</p>
 </div>`;

 return html`
 <div>
  <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}}>
   <h2>لوحة الإدارة</h2>
   <button class="btn ghost" onClick=${onClose}>رجوع</button>
  </div>

  <div class="panel">
   <h2 style=${{marginTop:0}}>${editing?'تعديل مباراة':'إضافة مباراة يدوياً'}</h2>
   <div class="form">
    <label>الفريق الأول
     <input value=${form.h} onChange=${e=>setForm(f=>({...f,h:e.target.value}))} placeholder="اسم الفريق الأول"/>
    </label>
    <label>الفريق الثاني
     <input value=${form.a} onChange=${e=>setForm(f=>({...f,a:e.target.value}))} placeholder="اسم الفريق الثاني"/>
    </label>
    <label>البطولة
     <select value=${form.lg} onChange=${e=>setForm(f=>({...f,lg:e.target.value}))}>
      ${LEAGUES.map(l=>html`<option value=${l.k}>${l.ar}</option>`)}
     </select>
    </label>
    <label>القناة الناقلة
     <select value=${form.channel||''} onChange=${e=>setForm(f=>({...f,channel:e.target.value}))}>
      <option value="">لم يتم التحديد</option>
      ${CHANNELS.map(c=>html`<option value=${c.id}>${c.name}</option>`)}
     </select>
    </label>
    <label>حالة المباراة
     <select value=${form.st} onChange=${e=>setForm(f=>({...f,st:e.target.value}))}>
      <option value="upcoming">لم تبدأ</option>
      <option value="live">مباشرة</option>
      <option value="finished">انتهت</option>
     </select>
    </label>
    <label>تاريخ ووقت المباراة
     <input type="datetime-local" value=${new Date(form.t).toLocaleString('sv-SE',{timeZone:TZ}).slice(0,16)} onChange=${e=>setForm(f=>({...f,t:new Date(e.target.value).toISOString()}))}/>
    </label>
    <label>الملعب
     <input value=${form.venue||''} onChange=${e=>setForm(f=>({...f,venue:e.target.value}))} placeholder="اسم الملعب"/>
    </label>
    <label>نتيجة الفريق الأول
     <input type="number" min="0" value=${form.hs??0} onChange=${e=>setForm(f=>({...f,hs:+e.target.value}))}/>
    </label>
    <label>نتيجة الفريق الثاني
     <input type="number" min="0" value=${form.as??0} onChange=${e=>setForm(f=>({...f,as:+e.target.value}))}/>
    </label>
   </div>

   <div style=${{display:'flex',gap:8,flexWrap:'wrap',marginTop:10}}>
    ${editing?html`
     <button class="btn" onClick=${saveEdit}>حفظ التعديلات</button>
     <button class="btn ghost" onClick=${()=>{setEditing('');setForm(blank())}}>إلغاء</button>
    `:html`<button class="btn" onClick=${add}>إضافة المباراة</button>`}
   </div>

   <div class="panel">
    <h2 style=${{marginTop:0}}>مصادر البث المرخّصة</h2>
    <p style=${{color:'var(--mut)',fontSize:12}}>أضف فقط روابط البث التي تملك حق استخدامها أو نشرها.</p>
    ${(form.sources||[]).map((s,i)=>html`
     <div class="arow">
      <span>${s.name} · ${s.type}</span>
      <button class="btn del" onClick=${()=>setForm(f=>({...f,sources:f.sources.filter((x,j)=>j!==i)}))}>حذف</button>
     </div>
    `)}
    <button class="btn ghost" style=${{marginTop:10}} onClick=${addSource}>إضافة مصدر</button>
   </div>
  </div>

  <div class="panel">
   <h2 style=${{marginTop:0}}>المباريات الموجودة (${ms.length})</h2>
   ${ms.map(m=>html`
    <div class="arow">
     <div style=${{flex:1}}>
      <b>${m.h} – ${m.a}</b>
      <div style=${{fontSize:11,color:'var(--mut)'}}>${LN(m.lg).ar} · ${STAT[m.st]} · ${m.channel?CHANNELS.find(c=>c.id===m.channel)?.name||'':''}</div>
     </div>
     <button class="btn ghost" onClick=${()=>edit(m)}>تعديل</button>
     <button class="btn del" onClick=${()=>remove(m.id)}>حذف</button>
    </div>
   `)}
   ${!ms.length?html`<div class="empty">ما كايناش مباريات مضافة يدوياً</div>`:null}
  </div>
 </div>`;
}function App(){
 const page=useHash();
 const api=useApi();
 const[ms,setMs]=useState(load);
 const[filter,setFilter]=useState('all');
 const[query,setQuery]=useState('');
 const[adminOpen,setAdminOpen]=useState(false);

 const[srcMap,setSrc]=useState(()=>{
  try{return JSON.parse(localStorage.getItem('koora-src-v1'))||{}}
  catch(e){return{}}
 });

 const[channelMap,setChannelMap]=useState(()=>{
  try{return JSON.parse(localStorage.getItem('koora-channel-v1'))||{}}
  catch(e){return{}}
 });

 useEffect(()=>{
  try{localStorage.setItem(KEY,JSON.stringify(ms))}catch(e){}
 },[ms]);

 useEffect(()=>{
  try{localStorage.setItem('koora-src-v1',JSON.stringify(srcMap))}catch(e){}
 },[srcMap]);

 useEffect(()=>{
  try{localStorage.setItem('koora-channel-v1',JSON.stringify(channelMap))}catch(e){}
 },[channelMap]);

 const isApi=api.state!=='off';

 const shown=isApi
  ?api.ms.map(m=>({
    ...m,
    sources:srcMap[m.id]||[],
    channel:channelMap[m.id]||''
   }))
  :ms;

 const setShown=fn=>{
  if(isApi){
   const updated=typeof fn==='function'?fn(shown):fn;
   setSrc(Object.fromEntries(updated.map(m=>[m.id,m.sources||[]])));
   setChannelMap(Object.fromEntries(
    updated.filter(m=>m.channel).map(m=>[m.id,m.channel])
   ));
  }else{
   setMs(fn);
  }
 };

 const selected=page.startsWith('match-')
  ?shown.find(m=>String(m.id)===page.slice(6))
  :null;

 const league=page.startsWith('league-')
  ?page.slice(7)
  :null;

 const nav=(p)=>{
  location.hash=p;
  setAdminOpen(false);
 };

 return html`
 <header>
  <div class="wrap">
   <div class="top">
    <a class="logo" href="#home">
     <i>⚽</i><span>KOORA <b>MAX</b></span>
    </a>
    <div class="search">
     <span>⌕</span>
     <input value=${query} onChange=${e=>setQuery(e.target.value)} placeholder="ابحث عن فريق أو بطولة..."/>
    </div>
   </div>
   <nav>
    <a href="#home" class=${page==='home'?'on':''}>الرئيسية</a>
    <a href="#leagues" class=${page==='leagues'?'on':''}>البطولات</a>
    <a href="#admin" class=${page==='admin'?'on':''}>الإدارة</a>
   </nav>
  </div>
 </header>

 <div class="demo">
  ${api.state==='loading'?'جاري تحميل المباريات...':
    api.state==='error'?'تعذر جلب المباريات من الخادم حالياً':
    isApi?'المباريات من خدمة النتائج':'وضع المباريات اليدوي'}
 </div>

 <main class="wrap" style=${{minHeight:'65vh',paddingTop:8}}>
  ${page==='home'?html`
   <${Home}
    ms=${shown}
    filter=${filter}
    setFilter=${setFilter}
    query=${query}
   />
  `:null}

  ${page==='leagues'?html`<${Leagues}/>`:null}

  ${league?html`<${LeaguePage} lg=${league} ms=${shown}/>`:null}

  ${page.startsWith('match-')?html`<${MatchPage} m=${selected}/>`:null}

  ${page==='admin'?html`
   <${Admin}
    ms=${shown}
    setMs=${setShown}
    isApi=${isApi}
    onClose=${()=>nav('home')}
   />
  `:null}

  ${!['home','leagues','admin'].includes(page)&&!page.startsWith('match-')&&!league?html`
   <div class="empty">الصفحة غير موجودة</div>
  `:null}
 </main>

 <footer>
  <div class="wrap">
   <div class="logo" style=${{justifyContent:'center',marginBottom:8}}>
    <i>⚽</i><span>KOORA <b>MAX</b></span>
   </div>
   <p>KOORA MAX – موقع لمتابعة مواعيد ونتائج مباريات كرة القدم.</p>
   <p style=${{marginTop:6}}>روابط المشاهدة توجه إلى المصادر الرسمية والمرخّصة.</p>
   <p style=${{marginTop:10}}>© ${new Date().getFullYear()} KOORA MAX</p>
  </div>
 </footer>
 `;
}

ReactDOM.createRoot(document.getElementById('root')).render(
 React.createElement(App)
);
</script>
</body>
</html>
